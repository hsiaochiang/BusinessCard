name: android-ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
      - name: Build debug (no publish)
        run: ./android-app/gradlew -p android-app :app:assembleDebug
